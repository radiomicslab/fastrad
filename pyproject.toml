[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastrad"
version = "1.2.0"
description = "GPU-accelerated Python library that reimplements pyradiomics with full feature parity"
readme = "README.md"
authors = [
    { name = "fastrad authors" }
]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["radiomics", "biomarkers", "pytorch", "cuda", "pyradiomics", "ibsi", "medical-imaging"]
dependencies = [
    "torch",
    "pydicom",
    "numpy",
    "scipy",
    "loguru",
    "SimpleITK",
    "nibabel",
    "requests>=2.33.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.0.0",
    "pyradiomics",
]

[project.optional-dependencies]
# NOTE (fixed during CMPB revision review): this previously listed
# "cucim-cu12" for GLSZM's CUDA connected-component labelling, matching
# the manuscript's Methods description. The actual implementation
# (fastrad/features/glszm.py) does NOT import cucim at all -- it uses
# CuPy (`cupyx.scipy.ndimage.label` via DLPack tensor transfer) instead,
# with a fallback to `scipy.ndimage.label` on CPU if CuPy is unavailable
# or fails. Either the manuscript's Methods section must be corrected to
# describe CuPy instead of cuCIM, or the code must be changed to actually
# use cuCIM as described -- pick one and make them match. cucim-cu12 has
# been removed here since it is not imported anywhere in the codebase.
cuda = [
    "torch>=2.0",
    "cupy-cuda12x>=14.0.1"
]
test = [
    "pytest",
    "ruff",
    "ty",
]
data-prep = [
    # Only needed to run benchmarks/download_tcia_sample.py, which
    # converts a real RTSTRUCT segmentation to a binary mask. Not needed
    # to use fastrad itself.
    "rt-utils",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.20.0",
    "sphinx-copybutton>=0.5.2",
    "numpydoc"
]

[tool.hatch.build.targets.wheel]
packages = ["fastrad"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["E402", "E701", "E712", "F841", "E722", "E741", "BLE001", "S110", "S112"]

[tool.ty]

[tool.ty.environment]
extra-paths = ["tests", "benchmarks"]

[tool.ty.rules]
unresolved-import = "warn"

[[tool.ty.overrides]]
include = ["tests/**", "benchmarks/**"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.uv.sources]
pyradiomics = { git = "https://github.com/AIM-Harvard/pyradiomics.git", rev = "8ed579383" }

[dependency-groups]
dev = [
    "ty>=0.0.29",
]
