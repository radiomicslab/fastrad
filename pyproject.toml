[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastrad"
version = "1.2.0"
description = "GPU-accelerated Python library that reimplements pyradiomics with full feature parity"
readme = "README.md"
authors = [
    { name = "Erika Sánchez-Femat; José-María Celaya-Padilla; Carlos-Eric Galván-Tejada" },
]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = [
    "radiomics",
    "biomarkers",
    "pytorch",
    "cuda",
    "pyradiomics",
    "ibsi",
    "medical-imaging",
]
dependencies = [
    "torch",
    "pydicom",
    "numpy",
    "scipy",
    "loguru",
    "SimpleITK",
    "nibabel",
    "requests>=2.33.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.0.0",
    "pyradiomics",
]

[project.optional-dependencies]
cuda = ["torch>=2.0", "cupy-cuda12x>=14.0.1"]
test = ["pytest", "ruff", "ty"]
data-prep = ["rt-utils"]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.20.0",
    "sphinx-copybutton>=0.5.2",
    "numpydoc",
]

[tool.hatch.build.targets.wheel]
packages = ["fastrad"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E402",
    "E701",
    "E712",
    "F841",
    "E722",
    "E741",
    "BLE001",
    "S110",
    "S112",
]

[tool.ty]

[tool.ty.environment]
extra-paths = ["tests", "benchmarks"]

[tool.ty.rules]
unresolved-import = "ignore"
unused-ignore-comment = "ignore"
redundant-cast = "ignore"
possibly-missing-attribute = "ignore"
possibly-missing-import = "ignore"
too-many-positional-arguments = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
unused-type-ignore-comment = "ignore"
missing-argument = "ignore"

[[tool.ty.overrides]]
include = ["tests/**", "benchmarks/**"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.uv.sources]
pyradiomics = { git = "https://github.com/AIM-Harvard/pyradiomics.git", rev = "8ed579383" }

[dependency-groups]
dev = ["ty>=0.0.29"]
